[project]
name = "miscan"
version = "2.0.0.dev0"
description = "Passive BLE scanner for Xiaomi thermometers: publishes their readings on MQTT and announces them to Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt>=2.5.1",
    "bleak>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
miscan = "miscan.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/miscan"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]
